server:
  port: 8081

spring:
  application:
    name: ciba-oauth2-client
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_BASE_URL}/realms/${KEYCLOAK_REALM:ciba-realm}
        registration:
          ciba-client:
            provider: keycloak
            client-id: ${CIBA_CLIENT_ID:ciba-agent}
            client-secret: ${CIBA_CLIENT_SECRET:ciba-agent-secret}
            authorization-grant-type: urn:openid:params:grant-type:ciba

keycloak:
  base-url: ${KEYCLOAK_BASE_URL:http://localhost:8180}
  realm: ${KEYCLOAK_REALM:ciba-realm}
  client-id: ${CIBA_CLIENT_ID:ciba-agent}
  client-secret: ${CIBA_CLIENT_SECRET:ciba-agent-secret}
  ciba:
    mode: poll          # poll | ping
    poll-interval-seconds: 3
    max-poll-attempts: 60
    signing-alg: PS256

agent:
  api-key: ${AGENT_API_KEY:dev-api-key-change-in-prod}

logging:
  level:
    com.ciba: DEBUG
