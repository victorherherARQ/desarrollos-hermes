server:
  port: 8081

spring:
  application:
    name: ciba-oauth2-client
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration

keycloak:
  ciba:
    base-url: ${KEYCLOAK_BASE_URL:http://localhost:8181}
    realm: ${KEYCLOAK_REALM:ciba-realm}
    client-id: ${CIBA_CLIENT_ID:ciba-agent}
    client-secret: ${CIBA_CLIENT_SECRET:ciba-agent-secret}
    mode: poll
    poll-interval-seconds: 3
    max-poll-attempts: 60
    signing-alg: PS256

resource-server:
  url: ${RESOURCE_SERVER_URL:http://ciba-resource-server:8082}

agent:
  apikey: changeme

logging:
  level:
    com.ciba: DEBUG
