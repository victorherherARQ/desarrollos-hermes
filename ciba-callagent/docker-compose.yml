services:
  # ─────────────────────────────────────────────────────────────────
  # Keycloak 26 — IdP with CIBA extension enabled
  # ─────────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    container_name: ciba-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HTTPS_ENABLED: "false"
      KC_DB: dev-mem
    ports:
      - "8181:8080"
    volumes:
      - ./keycloak/ciba-realm-realm.json:/opt/keycloak/data/import/ciba-realm-realm.json:ro
    networks:
      - ciba-network

  # ─────────────────────────────────────────────────────────────────
  # CIBA OAuth2 Client — initiates CIBA auth, polls Keycloak,
  # exposes /agent/** API for the AI agent (Hermes)
  # ─────────────────────────────────────────────────────────────────
  ciba-oauth2-client:
    build:
      context: ./ciba-oauth2-client
      dockerfile: Dockerfile
    container_name: ciba-oauth2-client
    ports:
      - "8081:8081"
    environment:
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: ciba-realm
      CIBA_CLIENT_ID: ciba-agent
      CIBA_CLIENT_SECRET: ciba-agent-secret
      RESOURCE_SERVER_URL: http://ciba-resource-server:8082
      AGENT_API_KEY: ${AGENT_API_KEY:-dev-api-key}
    depends_on:
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/ciba/client-info || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ciba-network

  # ─────────────────────────────────────────────────────────────────
  # CIBA Resource Server — validates CIBA JWTs, enforces CTI replay
  # prevention, serves protected user resources
  # ─────────────────────────────────────────────────────────────────
  ciba-resource-server:
    build:
      context: ./ciba-resource-server
      dockerfile: Dockerfile
    container_name: ciba-resource-server
    ports:
      - "8082:8082"
    environment:
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: ciba-realm
      RESOURCE_SERVER_AUDIENCE: calendar-api
    depends_on:
      keycloak:
        condition: service_started
      ciba-oauth2-client:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8082/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ciba-network

networks:
  ciba-network:
    driver: bridge
