version: "3.9"

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: ciba-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HTTPS_ENABLED: "false"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/ciba-realm.json:/opt/keycloak/data/import/ciba-realm.json:ro
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - ciba-network

  spring-boot-api:
    build:
      context: ./spring-boot-api
      dockerfile: Dockerfile
    container_name: ciba-spring-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_BOOT_API_URL=http://localhost:8080
      - KEYCLOAK_BASE_URL=http://keycloak:8080
      - KEYCLOAK_REALM=ciba-realm
      - KEYCLOAK_CLIENT_ID=calendar-api
      - KEYCLOAK_CLIENT_SECRET=calendar-api-secret
    env_file:
      - .env
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ciba-network

  agent-python:
    build:
      context: ./agent-python
      dockerfile: Dockerfile
    container_name: ciba-agent
    ports:
      - "7000:7000"
    environment:
      - KEYCLOAK_BASE_URL=http://keycloak:8080
      - KEYCLOAK_REALM=ciba-realm
      - CIBA_CLIENT_ID=ciba-agent
      - CIBA_CLIENT_SECRET=ciba-agent-secret
      - CIBA_MODE=poll
      - SPRING_BOOT_API_URL=http://spring-boot-api:8080
    env_file:
      - .env
    depends_on:
      spring-boot-api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ciba-network

volumes:
  keycloak_data:
    driver: local

networks:
  ciba-network:
    driver: bridge
