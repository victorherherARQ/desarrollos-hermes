# CIBA CallAgent — Spring Boot Configuration
# Two logical modes inside one app (controlled by profiles):
#   ciba-client  : initiates CIBA auth requests to Keycloak
#   resource-server : validates CIBA tokens issued by Keycloak
# Both run on the same Spring Boot process; use @Profile to activate.

# ── KEYCLOAK CONNECTION ──────────────────────────────────────────────────────
keycloak:
  base-url: http://localhost:8180
  realm: ciba-realm
  # Realm admin CLI credentials (for realm import / client provisioning)
  admin-username: admin
  admin-password: admin
  # CIBA client credentials (registered in Keycloak with CIBA enabled)
  ciba-client:
    client-id: ciba-agent
    client-secret: ciba-agent-secret
    # Supported modes: poll | ping
    mode: poll
    # Backchannel URI (only needed for ping mode)
    backchannel-client-uri: http://localhost:8080/ciba/ping-callback
    # Binding message shown to user on their phone
    binding-message-prefix: "Confirm agent: "
    # Polling interval in seconds (must match or exceed Keycloak interval)
    poll-interval-seconds: 5
    # Max poll attempts before giving up
    max-poll-attempts: 60
    # Nonce — should be random per request
    nonce: ""

# ── APP SERVER ────────────────────────────────────────────────────────────────
server:
  port: 8080
  servlet:
    context-path: /

# ── SPRING PROFILES ─────────────────────────────────────────────────────────
spring:
  profiles:
    active: ciba-client,resource-server
  application:
    name: ciba-callagent
  config:
    import: optional:classpath:secrets.properties

  # Resource server: JWT issuer validation against Keycloak JWKS
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak publishes its public keys at {base-url}/realms/{realm}
          issuer-uri: ${keycloak.base-url}/realms/${keycloak.realm}
          jwk-set-uri: ${keycloak.base-url}/realms/${keycloak.realm}/protocol/openid-connect/certs
          # audiences supported by this resource server
          audiences:
            - calendar-api
            - email-api
            - profile-api

# ── ENDPOINTS EXPOSED ────────────────────────────────────────────────────────
# The resource-server part protects these:
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.ciba: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web.reactive: DEBUG
