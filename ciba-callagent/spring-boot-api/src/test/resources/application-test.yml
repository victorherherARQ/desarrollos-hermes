spring:
  config:
    activate:
      on-profile: test
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/test-realm
          jwk-set-uri: http://localhost:8180/realms/test-realm/protocol/openid-connect/certs

keycloak:
  base-url: http://localhost:8180
  realm: test-realm
  ciba-client:
    client-id: test-ciba-agent
    client-secret: test-secret
    mode: poll
    poll-interval-seconds: 1
    max-poll-attempts: 3

logging:
  level:
    com.ciba: DEBUG
